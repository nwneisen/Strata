name: Build & Publish Docker Image (RTX 50)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/*.yml
      - Dockerfile
      - docker-entrypoint.sh
      - setup.py
      - requirements.txt
      - CMakeLists.txt
      - src/**
      - include/**
      - third_party/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to sha)"
        required: false
        type: string

env:
  IMAGE: ghcr.io/nwneisen/strata

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.sha && format('{0}:{1}', env.IMAGE, steps.tags.outputs.sha) || '' }}
          build-args: |
            CUDA_ARCHITECTURES=120
            BUILD_VISION=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
